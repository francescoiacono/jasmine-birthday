server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /site.webmanifest {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|android-chrome-\d+x\d+\.png)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
